name: tacab_ai
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.3
  http: ^1.3.0
  shared_preferences: ^2.0.6
  path_provider: ^2.0.2
  get: ^4.7.2
  gap: ^3.0.1
  flutter_svg: ^2.1.0
  image_picker: ^1.0.4  # ✅ saxan
  speech_to_text: ^7.0.0
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  firebase_auth: ^5.5.3
  firebase_core: ^3.13.0
  flutter_sound: ^9.28.0
  permission_handler: ^12.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon.png" # Path to your icon
  adaptive_icon_background: "#33490B" # Background color for adaptive icons (Android)
  adaptive_icon_foreground: "assets/logos/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

